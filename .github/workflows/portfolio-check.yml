name: Portfolio checks
on:
  push:
    branches: [main, portfolio-v2]
  pull_request:
jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-resume.txt
      - run: python -m pip install -r requirements-resume.txt
      - run: python -m unittest discover -s tests -p test_resume_export.py -v
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run astryx -- doctor --built dist
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-build
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
  browsers:
    runs-on: ubuntu-latest
    env:
      SITE_DIR: dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:threeui
      - run: npm run test:threeui
        env:
          THREEUI_ENGINE: webkit
          THREEUI_REPORT_DIR: test-results/threeui-webkit
      - run: npm run test:collaboration
      - run: npm run test:loading
      - run: npm run test:crm
      - run: npm run test:workbench
      - run: npm run test:astryx
      - run: npm run test:experience
        env:
          SKIP_PERFORMANCE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: test-results/
          if-no-files-found: error
