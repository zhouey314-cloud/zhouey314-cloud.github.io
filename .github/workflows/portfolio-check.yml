name: Portfolio checks
on:
  push:
    branches: [main, portfolio-v2]
  pull_request:
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-resume.txt
      - run: python -m pip install -r requirements-resume.txt
      - run: python -m unittest discover -s tests -p test_resume_export.py -v
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run astryx -- doctor --built dist
      - name: Verify deployment source
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/asset-manifest.json', 'utf8'));
          if (manifest.source_revision !== process.env.GITHUB_SHA || manifest.base !== '/' || !manifest.static) {
            throw new Error('Static artifact does not match this workflow commit and root-domain deployment');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-build
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload the verified static Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
          include-hidden-files: true
  browsers:
    runs-on: ubuntu-latest
    env:
      SITE_DIR: dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:threeui
      - run: npm run test:threeui
        env:
          THREEUI_ENGINE: webkit
          THREEUI_REPORT_DIR: test-results/threeui-webkit
      - run: npm run test:collaboration
      - run: npm run test:fallback
      - run: npm run test:fallback:guard
      - run: npm run test:loading
      - run: npm run test:crm
      - run: npm run test:workbench
      - run: npm run test:astryx
      - run: npm run test:experience
        env:
          SKIP_PERFORMANCE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: test-results/
          if-no-files-found: error
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [resume, site, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify main still points to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Deploy the artifact from this workflow run
        id: deployment
        uses: actions/deploy-pages@v4
