<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#eee8dc"/><g fill="#1b1c1b" font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="80" y="86" font-size="23" letter-spacing="2">THOUGHT-TO-X</text><text x="1320" y="86" text-anchor="end" font-size="21">公开示例 / 命运与选择</text><path d="M80 122H1320" stroke="#b8b4a8"/><text x="80" y="232" font-size="24" fill="#676a5e">01 / 原始想法</text><text x="80" y="323" font-size="32">每个人自己的命运</text><text x="80" y="378" font-size="32">从出生那一刻可能就已经定好</text><text x="80" y="433" font-size="32">就像电影每个时间点时间线都存在</text><text x="80" y="518" font-size="32">但是安于现状</text><text x="80" y="573" font-size="32">还是应该问自己想要什么</text><path d="M705 214V689" stroke="#b8b4a8"/><text x="770" y="232" font-size="24" fill="#676a5e">02 / 整理后的表达 · 节选</text><text x="770" y="323" font-size="34">命运是否写好，我不知道。</text><text x="770" y="403" font-size="34">但至少在走过它的时候，</text><rect x="754" y="440" width="481" height="60" fill="#c9ef73"/><text x="770" y="483" font-size="34">我想尽量真实一点。</text><text x="770" y="628" font-size="24" fill="#676a5e">保留原意，也保留不确定性。</text><path d="M80 754H1320" stroke="#b8b4a8"/><text x="80" y="817" font-size="22">原文来源：examples/destiny-example.md · 原创排版</text><text x="1320" y="860" text-anchor="end" font-size="20" fill="#676a5e">流程示意，非实时模型运行</text></g></svg>